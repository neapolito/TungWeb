<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TungWeb</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪵%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3e6d3;--panel:#e4cfb2;--bar:#d2b48c;--ink:#3b2314;--acc:#8b4a1f;--acc2:#c47a3a;--card:#fbf3e6;--line:#b98f63}
@media(prefers-color-scheme:dark){:root{--bg:#1e130c;--panel:#2c1b10;--bar:#3a2415;--ink:#f1dfc7;--acc:#d98a4a;--acc2:#a8602a;--card:#2a1a0f;--line:#5c3c24}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.tabs{display:flex;gap:4px;padding:6px 8px 0;background:var(--panel);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;min-width:120px;max-width:200px;padding:7px 10px;border-radius:10px 10px 0 0;background:var(--bar);cursor:pointer;font-size:13px;border:1px solid var(--line);border-bottom:0;opacity:.75}
.tab.on{background:var(--card);opacity:1;font-weight:bold}
.tab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab b{opacity:.6;padding:0 2px}
.plus{border:0;background:none;font-size:20px;cursor:pointer;padding:0 10px;color:var(--acc)}
.bar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.ib{border:1px solid var(--line);background:var(--bar);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
.ib:hover:not(:disabled){background:var(--acc2);color:#fff}.ib:disabled{opacity:.35}
#omni{flex:1;min-width:0;height:36px;border-radius:18px;border:2px solid var(--line);background:var(--bg);padding:0 14px;outline:0}
#omni:focus{border-color:var(--acc)}
.bm{display:flex;gap:6px;padding:4px 8px;background:var(--panel);overflow-x:auto;font-size:12px;flex:none;min-height:28px;align-items:center}
.bm a{white-space:nowrap;padding:3px 10px;border-radius:12px;background:var(--bar);cursor:pointer}
.main{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;display:none;flex-direction:column;overflow:auto}.pane.on{display:flex}
iframe{border:0;width:100%;flex:1;background:#fff}
.home{margin:auto;width:100%;max-width:720px;padding:24px 16px;text-align:center}
.home h1{margin:6px 0 2px;font-size:44px;color:var(--acc)}.home p{margin:0 0 18px;opacity:.8}
.sbox{display:flex;gap:6px;max-width:560px;margin:0 auto 22px}
.sbox input{flex:1;min-width:0;height:44px;border-radius:22px;border:2px solid var(--line);background:var(--card);padding:0 18px;outline:0}
.sbox select{border-radius:22px;border:2px solid var(--line);background:var(--card);padding:0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;cursor:pointer;font-size:14px}
.tile:hover{transform:translateY(-2px);border-color:var(--acc)}.tile i{display:block;font-style:normal;font-size:26px}
.btn{border:0;background:var(--acc);color:#fff;border-radius:20px;padding:0 16px;cursor:pointer;height:40px}
.vid{width:100%;max-width:960px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.vid .row{display:flex;gap:6px}
.vid input{flex:1;min-width:0;height:40px;border-radius:20px;border:2px solid var(--line);background:var(--card);padding:0 16px;outline:0}
.screen{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:4px solid var(--acc);box-shadow:0 8px 24px #0006}
.screen iframe{width:100%;height:100%}.vid.theater{max-width:none;padding:6px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;text-align:center;color:#f1dfc7}
</style></head>
<body>
<div class="tabs" id="tabs"></div>
<div class="bar">
<button class="ib" id="back" title="Back">←</button><button class="ib" id="fwd" title="Forward">→</button>
<button class="ib" id="reload" title="Reload">⟳</button><button class="ib" id="homeb" title="Home">🏠</button>
<input id="omni" placeholder="Search, enter a URL, or paste a YouTube link…" autocomplete="off" spellcheck="false">
<button class="ib" id="star" title="Bookmark">☆</button>
</div>
<div class="bm" id="bm"></div>
<div class="main" id="main"></div>
<script>
const $=s=>document.querySelector(s);
const ST={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let tabs=[],cur=0,uid=0,marks=ST.get('tw_marks',[]),engine=ST.get('tw_engine','ddg');
const SE={ddg:q=>'https://html.duckduckgo.com/html/?q='+encodeURIComponent(q),bing:q=>'https://www.bing.com/search?q='+encodeURIComponent(q),wiki:q=>'https://en.wikipedia.org/w/index.php?search='+encodeURIComponent(q)};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
function mascot(s){return `<svg width="${s}" height="${s}" viewBox="0 0 120 120"><ellipse cx="60" cy="112" rx="34" ry="6" fill="#0003"/><rect x="30" y="22" width="60" height="86" rx="14" fill="#8b4a1f" stroke="#4a2410" stroke-width="3"/><ellipse cx="60" cy="24" rx="30" ry="11" fill="#c47a3a" stroke="#4a2410" stroke-width="3"/><ellipse cx="60" cy="24" rx="18" ry="6" fill="none" stroke="#8b4a1f" stroke-width="2"/><ellipse cx="60" cy="24" rx="8" ry="2.5" fill="none" stroke="#8b4a1f" stroke-width="2"/><circle cx="47" cy="58" r="9" fill="#fff"/><circle cx="73" cy="58" r="9" fill="#fff"/><circle cx="49" cy="59" r="4.5" fill="#2a140a"/><circle cx="71" cy="59" r="4.5" fill="#2a140a"/><path d="M46 78q14 14 28 0" fill="none" stroke="#2a140a" stroke-width="4" stroke-linecap="round"/><path d="M30 70q-14 4-18 16M90 70q14 4 18 16" stroke="#4a2410" stroke-width="5" stroke-linecap="round" fill="none"/></svg>`}
function yt(s){const m=s.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#\s]*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);if(!m)return null;const t=s.match(/[?&](?:t|start)=(\d+)/);return{id:m[1],start:t?+t[1]:0}}
function resolve(s){s=s.trim();if(!s)return null;
 const v=yt(s);if(v)return{type:'video',url:s,id:v.id,start:v.start,title:'TungPlayer'};
 if(/^https?:\/\//i.test(s))return{type:'web',url:s,title:host(s)};
 if(!/\s/.test(s)&&/^[\w-]+(\.[\w-]+)+(:\d+)?([\/?#].*)?$/.test(s))return{type:'web',url:'https://'+s,title:host(s)};
 return{type:'web',url:SE[engine](s),title:'Search'}}
const get=()=>tabs.find(t=>t.id===cur);
function newTab(input){const t={id:++uid,type:'home',url:'',id2:'',title:'New Tab',hist:[{type:'home',url:'',title:'New Tab'}],i:0,ver:0};tabs.push(t);cur=t.id;input?nav(t,input):render();return t}
function setv(t,r){Object.assign(t,{type:r.type,url:r.url||'',vid:r.id||'',start:r.start||0,title:r.title||'New Tab'});t.ver++;render()}
function nav(t,input){const r=typeof input==='string'?resolve(input):input;if(!r)return;t.hist=t.hist.slice(0,t.i+1);t.hist.push(r);t.i++;setv(t,r)}
function go(d){const t=get(),n=t.i+d;if(n<0||n>=t.hist.length)return;t.i=n;setv(t,t.hist[n])}
function sync(t,f){ // read the proxied page's real address from the same-origin iframe
 try{const l=f.contentWindow.location;if(!l.pathname.startsWith('/p/'))return;
  const u=(l.pathname.slice(3)+l.search+l.hash).replace(/^(https?):\/+/i,'$1://');
  const ti=(f.contentDocument&&f.contentDocument.title)||host(u);
  if(u!==t.url){t.url=u;t.hist=t.hist.slice(0,t.i+1);t.hist.push({type:'web',url:u,title:ti});t.i++}
  t.title=ti;if(t.hist[t.i])t.hist[t.i].title=ti;chrome()}catch(e){}}
function fill(p,t){p.dataset.k=t.id+':'+t.ver;
 if(t.type==='home'){
  p.innerHTML=`<div class="home">${mascot(110)}<h1>TungWeb</h1><p>Tung says: browse anything. 🪵</p><div class="sbox"><select><option value="ddg">DuckDuckGo</option><option value="bing">Bing</option><option value="wiki">Wikipedia</option></select><input placeholder="Search or enter a URL"></div>
  <div class="tiles"><div class="tile" data-u="https://en.wikipedia.org"><i>📚</i>Wikipedia</div><div class="tile" data-u="https://news.ycombinator.com"><i>📰</i>Hacker News</div><div class="tile" data-u="https://www.reddit.com"><i>💬</i>Reddit</div><div class="tile" data-u="https://archive.org"><i>🏛️</i>Archive</div><div class="tile" data-v="1"><i>📺</i>TungPlayer</div></div></div>`;
  const e=p.querySelector('select');e.value=engine;e.onchange=()=>{engine=e.value;ST.set('tw_engine',engine)};
  p.querySelector('input').onkeydown=ev=>{if(ev.key==='Enter')nav(t,ev.target.value)};
  p.querySelectorAll('.tile').forEach(x=>x.onclick=()=>x.dataset.v?nav(t,{type:'video',url:'',id:'',title:'TungPlayer'}):nav(t,x.dataset.u));
 }else if(t.type==='web'){
  p.innerHTML='';const f=document.createElement('iframe');
  f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation');
  f.setAttribute('allow','fullscreen');f.onload=()=>sync(t,f);f.src='/p/'+t.url;p.append(f);
 }else{
  const src=t.vid?`https://www.youtube-nocookie.com/embed/${t.vid}?autoplay=1&rel=0${t.start?'&start='+t.start:''}`:'';
  p.innerHTML=`<div class="vid"><div class="row"><input placeholder="Paste a YouTube link…"><button class="btn">▶ Play</button><button class="btn" data-th>🎬 Theater</button></div><div class="screen">${src?`<iframe src="${src}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>`:`<div class="empty">${mascot(90)}<b>TungPlayer</b><span>Paste a YouTube link above to start watching.</span></div>`}</div></div>`;
  const inp=p.querySelector('input');inp.value=t.url||'';
  const play=()=>{if(!yt(inp.value)){inp.value='';inp.placeholder='That is not a YouTube link';inp.style.borderColor='#c0392b';return}nav(t,resolve(inp.value))};
  inp.onkeydown=e=>{if(e.key==='Enter')play()};p.querySelector('.btn').onclick=play;
  p.querySelector('[data-th]').onclick=()=>p.querySelector('.vid').classList.toggle('theater');
 }}
function chrome(){const t=get();if(!t)return;
 const tb=$('#tabs');tb.innerHTML='';
 tabs.forEach(x=>{const d=document.createElement('div');d.className='tab'+(x.id===cur?' on':'');d.innerHTML=`<span>${x.type==='video'?'📺 ':x.type==='home'?'🪵 ':''}${esc(x.title||'New Tab')}</span><b>×</b>`;
  d.onclick=()=>{cur=x.id;render()};d.querySelector('b').onclick=e=>{e.stopPropagation();closeTab(x.id)};tb.append(d)});
 const pl=document.createElement('button');pl.className='plus';pl.textContent='+';pl.onclick=()=>newTab();tb.append(pl);
 if(document.activeElement!==$('#omni'))$('#omni').value=t.type==='home'?'':t.type==='video'?(t.url||''):t.url;
 $('#back').disabled=t.i<=0;$('#fwd').disabled=t.i>=t.hist.length-1;
 $('#star').textContent=t.url&&marks.some(b=>b.u===t.url)?'★':'☆';document.title=(t.title||'New Tab')+' — TungWeb';
 const b=$('#bm');b.innerHTML='';
 marks.forEach(x=>{const a=document.createElement('a');a.textContent='🔖 '+x.t;a.title='Click to open · right-click to remove';a.onclick=()=>nav(get(),x.u);a.oncontextmenu=e=>{e.preventDefault();marks=marks.filter(y=>y!==x);ST.set('tw_marks',marks);chrome()};b.append(a)});
 if(!marks.length)b.innerHTML='<span style="opacity:.6">Star a page to bookmark it. Right-click a bookmark to remove it.</span>'}
function render(){const m=$('#main');
 tabs.forEach(t=>{let p=document.getElementById('p'+t.id);if(!p){p=document.createElement('div');p.className='pane';p.id='p'+t.id;m.append(p);fill(p,t)}else if(p.dataset.k!==t.id+':'+t.ver)fill(p,t);p.classList.toggle('on',t.id===cur)});
 [...m.children].forEach(p=>{if(!tabs.some(t=>'p'+t.id===p.id))p.remove()});chrome()}
function closeTab(id){const i=tabs.findIndex(t=>t.id===id);tabs.splice(i,1);if(!tabs.length)return newTab();if(cur===id)cur=tabs[Math.max(0,i-1)].id;render()}
$('#omni').onkeydown=e=>{if(e.key==='Enter'){nav(get(),e.target.value);e.target.blur()}};
$('#omni').onfocus=e=>e.target.select();$('#omni').onblur=()=>chrome();
$('#back').onclick=()=>go(-1);$('#fwd').onclick=()=>go(1);
$('#reload').onclick=()=>{const t=get();t.ver++;render()};
$('#homeb').onclick=()=>nav(get(),{type:'home',url:'',title:'New Tab'});
$('#star').onclick=()=>{const t=get();if(!t.url)return;const i=marks.findIndex(b=>b.u===t.url);i>=0?marks.splice(i,1):marks.push({t:t.title||host(t.url),u:t.url});ST.set('tw_marks',marks);chrome()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='l'){e.preventDefault();$('#omni').focus()}});
newTab();
</script></body></html>
